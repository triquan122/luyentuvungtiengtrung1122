<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quest - Millionaire Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header Styles */
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(0, 255, 255, 0.2);
        }

        .game-title {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #00f5ff, #a855f7, #00f5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .stats-container {
            display: flex;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }

        .stat-label {
            font-size: 0.9em;
            color: #00f5ff;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        /* Main Container */
        .main-container {
            display: flex;
            justify-content: center;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Game Container */
        .game-container {
            flex: 1;
            max-width: 900px;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .question-number {
            color: #a855f7;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #00f5ff;
            font-weight: 600;
        }

        .question-example {
            font-size: 1em;
            color: #ccc;
            font-style: italic;
            margin-bottom: 20px;
        }

        .timer-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #ffbe0b);
            transition: width 0.1s linear;
        }

        /* Answer Options */
        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 255, 0.3);
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            text-align: left;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .answer-btn:hover {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00f5ff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }

        .answer-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .answer-btn:active {
            transform: translateY(-1px);
        }

        .answer-btn.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
            animation: correct-flash 0.5s ease;
        }

        .answer-btn.wrong {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            animation: shake 0.5s ease;
        }

        @keyframes correct-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Feedback */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .feedback-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            border: 2px solid rgba(0, 255, 255, 0.3);
        }

        .feedback-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .feedback-title {
            font-size: 2em;
            margin-bottom: 15px;
            color: #00f5ff;
        }

        .feedback-text {
            font-size: 1.1em;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .continue-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none;
            color: #fff;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }

        /* Start Screen */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .start-content {
            text-align: center;
            padding: 40px;
        }

        .start-title {
            font-size: 4em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00f5ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .start-subtitle {
            font-size: 1.5em;
            color: #ccc;
            margin-bottom: 40px;
        }

        .start-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none;
            color: #fff;
            padding: 20px 60px;
            border-radius: 15px;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 255, 255, 0.5);
        }

        /* Particles Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00f5ff;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 6s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-30px) translateX(20px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8em;
            }
            .question-text {
                font-size: 1.3em;
            }
            .start-title {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <!-- Particles Background -->
    <div class="particles" id="particles"></div>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <h1 class="start-title">🎮 TEST</h1>
            <p class="start-subtitle">Kiểm tra từ vựng</p>
            <button class="start-btn" onclick="startGame()">BẮT ĐẦU</button>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <h1 class="game-title">💰 TEST</h1>
        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-label">Câu hỏi hiện tại</div>
                <div class="stat-value" id="currentLevel">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Tổng điểm</div>
                <div class="stat-value" id="totalScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Lần chơi tốt nhất</div>
                <div class="stat-value" id="bestScore">0</div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Game Container -->
        <main class="game-container">
            <div class="question-card" id="questionCard">
                <div class="question-number" id="questionNumber">Câu hỏi 1</div>
                <div class="question-text" id="questionText">Loading...</div>
                <div class="question-example" id="questionExample"></div>
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill" style="width: 100%"></div>
                </div>
                <div class="answers-grid" id="answersGrid"></div>
            </div>
        </main>
    </div>

    <!-- Feedback Overlay -->
    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-card">
            <div class="feedback-icon" id="feedbackIcon">✅</div>
            <div class="feedback-title" id="feedbackTitle">Chính xác!</div>
            <div class="feedback-text" id="feedbackText"></div>
            <button class="continue-btn" onclick="handleFeedbackAction()">Tiếp tục</button>
        </div>
    </div>

    <script>
        // ==================== GAME DATA ====================
        const vocabulary = [
 
  { word: "愛", pinyin: "ài", meaning: "yêu, tình yêu", example: "他對家人充滿愛。" },
{ word: "哎", pinyin: "āi", meaning: "ai, thán từ", example: "哎，你怎麼這麼晚來了？" },
{ word: "唉", pinyin: "āi", meaning: "thở dài, than thở", example: "唉，今天的工作真累。" },
{ word: "愛情", pinyin: "àiqíng", meaning: "tình yêu", example: "他們之間的愛情很浪漫。" },
{ word: "愛惜", pinyin: "àixí", meaning: "trân trọng, quý trọng", example: "我們應該愛惜每一滴水。" },
{ word: "愛心", pinyin: "àixīn", meaning: "tấm lòng, lòng yêu thương", example: "她很有愛心。" },
{ word: "按", pinyin: "àn", meaning: "dựa theo, theo", example: "我們應該按規則行事。" },
{ word: "安定", pinyin: "āndìng", meaning: "ổn định", example: "他現在的生活非常安定。" },
{ word: "安排", pinyin: "ānpái", meaning: "sắp xếp, sắp đặt", example: "老師安排我們的座位。" },
{ word: "安心", pinyin: "ānxīn", meaning: "yên tâm", example: "你可以安心地去旅行。" },
{ word: "按照", pinyin: "ànzhào", meaning: "dựa theo, căn cứ theo", example: "我們要按照計劃進行。" },
{ word: "阿姨", pinyin: "āyí", meaning: "dì, cô", example: "阿姨來我們家做客。" },

{ word: "白", pinyin: "bái", meaning: "trắng", example: "他的衣服是白色的。" },
{ word: "擺", pinyin: "bǎi", meaning: "bày biện", example: "他把書桌擺得整整齊齊。" },
{ word: "白菜", pinyin: "báicài", meaning: "bắp cải", example: "媽媽買了一些白菜做晚餐。" },
{ word: "百貨公司", pinyin: "bǎihuògōngsī", meaning: "trung tâm mua sắm", example: "我們明天去百貨公司逛街吧。" },
{ word: "白天", pinyin: "báitiān", meaning: "ban ngày", example: "白天我喜歡出去散步。" },
{ word: "辦", pinyin: "bàn", meaning: "xử lý, giải quyết", example: "他需要辦很多事情。" },
{ word: "棒", pinyin: "bàng", meaning: "giỏi, tuyệt", example: "他的足球技巧非常棒。" },
{ word: "榜樣", pinyin: "bǎngyàng", meaning: "tấm gương", example: "他是我學習的榜樣。" },
{ word: "幫助", pinyin: "bāngzhù", meaning: "giúp đỡ", example: "他常常幫助別人。" },
{ word: "班機", pinyin: "bānjī", meaning: "chuyến bay", example: "這班機晚上八點起飛。" },
{ word: "搬家", pinyin: "bānjiā", meaning: "chuyển nhà", example: "我們下個月搬家。" },
{ word: "半夜", pinyin: "bànyè", meaning: "nửa đêm", example: "他半夜才回到家。" },
{ word: "抱", pinyin: "bào", meaning: "ôm", example: "他抱著他的孩子。" },
{ word: "包", pinyin: "bāo", meaning: "gói, bao", example: "媽媽包了一些餃子。" },
{ word: "寶貝", pinyin: "bǎobèi", meaning: "bảo bối, cưng", example: "她的小寶貝很可愛。" },
{ word: "寶貴", pinyin: "bǎoguì", meaning: "quý giá", example: "這是我最寶貴的經驗。" },
{ word: "保護", pinyin: "bǎohù", meaning: "bảo vệ", example: "我們要保護環境。" },
{ word: "報名", pinyin: "bàomíng", meaning: "đăng ký", example: "我們已經報名參加比賽。" },
{ word: "抱怨", pinyin: "bàoyuàn", meaning: "phàn nàn", example: "他總是抱怨工作太累。" },
{ word: "保證", pinyin: "bǎozhèng", meaning: "đảm bảo", example: "我保證這件事一定會成功。" },
{ word: "巴士", pinyin: "bāshì", meaning: "xe buýt", example: "我們坐巴士去市中心。" },
{ word: "背包", pinyin: "bēibāo", meaning: "ba lô", example: "他的背包裡裝滿了書。" },
{ word: "被動", pinyin: "bèidòng", meaning: "bị động", example: "他在工作中總是很被動。" },
{ word: "北方", pinyin: "běifāng", meaning: "phương Bắc", example: "北方的冬天非常寒冷。" },
{ word: "背景", pinyin: "bèijǐng", meaning: "bối cảnh", example: "這個故事的背景很有趣。" },
{ word: "笨", pinyin: "bèn", meaning: "ngốc, vụng về", example: "他常常被人說笨。" },
{ word: "本", pinyin: "běn", meaning: "cuốn (lượng từ cho sách)", example: "這是一本很有名的書。" },
{ word: "筆", pinyin: "bǐ", meaning: "cây bút", example: "這支筆很好寫。" },
{ word: "比", pinyin: "bǐ", meaning: "so với", example: "他比我高。" },
{ word: "變", pinyin: "biàn", meaning: "thay đổi", example: "他的態度變了。" },
{ word: "變成", pinyin: "biànchéng", meaning: "trở thành", example: "雨變成雪了。" },
{ word: "變化", pinyin: "biànhuà", meaning: "sự thay đổi", example: "天氣的變化很快。" },
{ word: "便條", pinyin: "biàntiáo", meaning: "giấy ghi chú", example: "他留了一張便條給我。" },



        ];

        // ==================== GAME STATE ====================
        let gameState = {
            currentLevel: 1,
            totalScore: 0,
            bestScore: 0,
            currentQuestion: null,
            usedQuestions: [],
            timer: null,
            timeLeft: 30,
            isWrong: false
        };

        // Load saved game state
        function loadGameState() {
            const saved = localStorage.getItem('englishMillionaireSave');
            if (saved) {
                const data = JSON.parse(saved);
                gameState.bestScore = data.bestScore || 0;
            }
        }

        // Save game state
        function saveGameState() {
            const toSave = {
                bestScore: gameState.bestScore
            };
            localStorage.setItem('englishMillionaireSave', JSON.stringify(toSave));
        }

        // ==================== INITIALIZE ====================
        function init() {
            createParticles();
            loadGameState();
            updateUI();
        }

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                container.appendChild(particle);
            }
        }

        // Hàm xáo trộn mảng
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // ==================== GAME FLOW ====================
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            resetGame();
            loadQuestion();
        }

        function resetGame() {
            gameState.currentLevel = 1;
            gameState.totalScore = 0;
            gameState.usedQuestions = [];
            gameState.isWrong = false;
            updateUI();
        }

        function loadQuestion() {
            // Lấy các từ chưa dùng
            const availableWords = vocabulary.filter(v => !gameState.usedQuestions.includes(v.word));
            
            // Nếu đã hết từ, reset lại
            if (availableWords.length === 0) {
                gameState.usedQuestions = [];
                availableWords.push(...vocabulary);
            }

            // Random một từ bất kỳ
            const question = availableWords[Math.floor(Math.random() * availableWords.length)];
            gameState.currentQuestion = question;
            gameState.usedQuestions.push(question.word);

            // Tạo 3 đáp án sai ngẫu nhiên
            const wrongAnswers = shuffleArray(vocabulary)
                .filter(v => v.word !== question.word)
                .slice(0, 3)
                .map(v => v.meaning);

            const answers = shuffleArray([...wrongAnswers, question.meaning]);

            document.getElementById('questionNumber').textContent = `Câu hỏi ${gameState.currentLevel}`;
            document.getElementById('questionText').textContent = question.word;
            document.getElementById('questionExample').textContent = question.example ? `"${question.example}"` : '';

            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';
            answers.forEach(answer => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = answer;
                btn.onclick = () => checkAnswer(answer);
                grid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            gameState.timeLeft = 30;
            const timerFill = document.getElementById('timerFill');
            
            clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                gameState.timeLeft -= 0.1;
                const percentage = (gameState.timeLeft / 30) * 100;
                timerFill.style.width = percentage + '%';

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    checkAnswer(null); // Hết giờ
                }
            }, 100);
        }

        function checkAnswer(answer) {
            clearInterval(gameState.timer);
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.onclick = null);

            const correct = answer === gameState.currentQuestion.meaning;

            if (correct) {
                // Highlight correct button
                buttons.forEach(btn => {
                    if (btn.textContent === answer) {
                        btn.classList.add('correct');
                    }
                });

                // Add score (100 điểm mỗi câu đúng)
                const reward = 100;
                gameState.totalScore += reward;

                setTimeout(() => {
                    showFeedback(
                        '✅',
                        'Chính xác!',
                        `+${reward} điểm\n"${gameState.currentQuestion.word}" nghĩa là "${gameState.currentQuestion.meaning}"`
                    );
                }, 500);

            } else {
                // Highlight correct and wrong answers
                buttons.forEach(btn => {
                    if (btn.textContent === gameState.currentQuestion.meaning) {
                        btn.classList.add('correct');
                    } else if (btn.textContent === answer || answer === null) {
                        btn.classList.add('wrong');
                    }
                });

                gameState.isWrong = true;

                setTimeout(() => {
                    showFeedback(
                        '❌',
                        'Trả lời sai!',
                        `Đáp án đúng: "${gameState.currentQuestion.meaning}"\n\nTổng điểm của bạn: ${gameState.totalScore} điểm\n\n"${gameState.currentQuestion.word}" - ${gameState.currentQuestion.meaning}${gameState.currentQuestion.example ? '\nVí dụ: ' + gameState.currentQuestion.example : ''}`
                    );
                }, 500);
            }

            // Update best score
            if (gameState.totalScore > gameState.bestScore) {
                gameState.bestScore = gameState.totalScore;
                saveGameState();
            }

            updateUI();
        }

        function showFeedback(icon, title, text) {
            document.getElementById('feedbackIcon').textContent = icon;
            document.getElementById('feedbackTitle').textContent = title;
            document.getElementById('feedbackText').textContent = text;
            document.getElementById('feedbackOverlay').style.display = 'flex';
        }

        function handleFeedbackAction() {
            document.getElementById('feedbackOverlay').style.display = 'none';
            
            if (gameState.isWrong) {
                // Game over – quay lại màn hình bắt đầu
                document.getElementById('startScreen').style.display = 'flex';
                resetGame();
            } else {
                // Sang câu tiếp theo
                gameState.currentLevel++;
                loadQuestion();
            }
        }

        function updateUI() {
            document.getElementById('currentLevel').textContent = gameState.currentLevel;
            document.getElementById('totalScore').textContent = gameState.totalScore.toLocaleString();
            document.getElementById('bestScore').textContent = gameState.bestScore.toLocaleString();
        }

        // ==================== START GAME ====================
        init();
    </script>
</body>
</html>
